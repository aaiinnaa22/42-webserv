# Server Configuration

server # helloooooooo
{
	listen 127.0.0.1:8080;	; # Port to listen
	server_name test.com www.test.com;
	max_client_body_size 500000 
	max_client_header_size 4000 
	root ./www 
	index index.html 
	
	error_page 400 /error/400.html;

	location	/
	{
		root home;
		methods GET POST;
		cgi_path_php /usr/bin # /opt/homebrew/bin;
		cgi_path_python /usr/bin;
		dir_listing off;
	}
	location /oldDir/
	{
		methods GET;
		root home/oldDir;
		return 307 /newDir/;
	}
	location /newDir/
	{
		root home/newDir;
		methods GET;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
	}
	location /images/
	{
		root home/images;
		methods GET POST DELETE;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin asad;
		upload home/images/uploads/;
		dir_listing on;
	}
	
	location /images/uploads/
	{
		root home/images/uploads;
		methods GET POST DELETE;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing on;
	}
	location /cgi/
	{
		root home/cgi;
		methods GET POST;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing off;
	}
	location /imagesREDIR/
	{
		methods GET;
		root home/imagesREDIR;
		return 307 /images/;
	}

	location /imagesREDIR/
	{
		methods GET;
		root home/imagesREDIR;
		return 301 /images/;
	}
}



