# Server Configuration

server # helloooooooo
{
	listen 127.0.0.1:8080;	; # Port to listen

	server_name test.com www.test.com;
	max_client_body_size 5000000;
	max_client_header_size 4000;
	root ./www;

	# Custom error pages
	error_page 400 /www/error/400.html;
	error_page 403 /www/error/403.html;
	error_page 404 /www/error/404.html;
	error_page 405 /www/error/405.html;
	error_page 408 /www/error/408.html;
	error_page 409 /www/error/409.html;
	error_page 411 /www/error/411.html;
	error_page 413 /www/error/413.html;
	error_page 414 /www/error/414.html;
	error_page 415 /www/error/415.html;
	error_page 431 /www/error/431.html;
	error_page 500 /www/error/500.html;
	error_page 501 /www/error/501.html;
	error_page 503 /www/error/503.html;
	error_page 505 /www/error/505.html;

	# Index.html
	index index.html;

	# Routes
	location	 /
	{
		root home;
		methods GET POST;
		cgi_path_php /usr/bin # /opt/homebrew/bin;
		cgi_path_python /usr/bin;
		dir_listing off;
	}
	location /oldDir/
	{
		root home/oldDir;
		return 307 /newDir/;
	}
	location /newDir/
	{
		root home/newDir;
		methods GET;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing on;
	}
	location /images/
	{
		root home/images;
		methods GET POST DELETE;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		upload_dir home/images/uploads/;
		dir_listing on;
	}
	location /images/uploads/
	{
		root home/images/uploads;
		methods GET POST DELETE;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing on;
	}
	location /cgi/
	{
		root home/cgi;
		methods GET POST;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing off;
	}
	location /imagesREDIR/
	{
		root home/imagesREDIR;
		return 301 /images/;
	}
}

server
{
	listen 127.0.0.1:1234;
	server_name swedish_server;
	
	root /var/www/html;
	error_page 404 /404.html

    location	 /
	{
		root /var/www/html;
		methods GET POST;
		cgi_path_php /usr/bin;
		cgi_path_python /usr/bin;
		dir_listing on;
    }
}
