
server
{
	listen 127.0.0.1:1234;
	server_name swedish_server;
	root aina_website;
	max_client_body_size 1000000;
	max_client_header_size 4000;
	index index.html

	error_page 404 ./grr/404.html;

    location	 /
	{
		index index.html;
		root aina_website;
		methods GET POST DELETE;
		cgi_path_php /usr/bin/php-cgi;
		cgi_path_python /usr/bin/python3;
		dir_listing off;
    }
	location /grr/
	{
		index index.html;
		methods GET POST DELETE;
		root ./aina_website;
		dir_listing on;
		upload /mupload/;
	}
	location /upload 
	{
		index index.html;
		root ./aina_website;
		methods GET POST;
	}
	location /mi/
	{
		methods GET;
		return 307 https://google.com 
	}
}